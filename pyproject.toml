[project]
name = "fm26-ai-copilot"
version = "0.1.0"
description = "Real-time AI co-pilot scaffold for Football Manager 26 3D matches."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26.0",
  "opencv-python>=4.9.0.80",
  "onnxruntime>=1.18.0",
  "PySide6>=6.7.0",
  "dxcam>=0.0.5",
  "easyocr>=1.7.0",
]

[project.optional-dependencies]
# Second OCR backend for course evaluation / “alternative AI approach” (install Tesseract binary on OS)
benchmark = ["pytesseract>=0.3.10"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
