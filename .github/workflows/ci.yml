name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runtime
        run: |
          python -m pip install -U pip
          # Skip EasyOCR/PyTorch/Qt/dxcam for CI unit tests; install logic deps only.
          python -m pip install pytest ruff "numpy>=1.26" "opencv-python-headless>=4.9"
          python -m pip install -e . --no-deps

      - name: Ruff
        run: python -m ruff check fm26_copilot tests

      - name: Pytest
        run: python -m pytest -q
